<html lang="en">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- D-05 keeps the participant token in the URL query string; poster images load
         cross-origin from TMDB's image CDN, so this stops the token-bearing URL riding
         along in a Referer header (threat T-06-04). -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

  </head>
