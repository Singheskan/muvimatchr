spring.application.name=MuviMatchr

spring.datasource.url=jdbc:postgresql://localhost:5432/muvimatchr
spring.datasource.username=muvimatchr
spring.datasource.password=muvimatchr
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

tmdb.api.base-url=https://api.themoviedb.org/3
tmdb.api.read-access-token=${TMDB_API_TOKEN:}
tmdb.cache.deck-ttl-hours=6
tmdb.cache.reference-ttl-hours=168
# Sizing: a deck page is ~20 movies, TMDB's current published guidance is a soft ~40 req/s
# ceiling, and 8 in-flight keeps a single refresh comfortably inside that while still finishing
# in a handful of round trips rather than twenty sequential ones.
tmdb.provider-lookup.max-concurrency=8
