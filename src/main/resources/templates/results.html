<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Voting Results</title>
</head>
<body>
<h1>Your Voting Results</h1>
<ul>
    <li th:each="entry : ${votes}">
        <span th:text="${entry.key}"></span>:
        <span th:text="${entry.value}"></span>
    </li>
</ul>
</body>
</html>
