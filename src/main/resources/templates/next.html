<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Movie Voting</title>
    <style>
        .movie-container {
            text-align: center;
            margin-top: 50px;
        }
        .movie-cover {
            max-width: 300px;
            max-height: 400px;
        }
        .vote-buttons {
            margin-top: 20px;
        }
        .vote-buttons button {
            font-size: 20px;
            margin: 0 10px;
            padding: 10px 20px;
        }
    </style>
</head>
<body>
<div class="movie-container">
    <!-- Movie Cover -->
    <img src="path_to_movie_cover.jpg" alt="Movie Cover" class="movie-cover" th:src="@{${movie.coverUrl}}" />

    <!-- Voting Buttons -->
    <div class="vote-buttons">
        <form action="/vote" method="post">
            <input type="hidden" name="vote" value="up" />
            <button type="submit">👍 Upvote</button>
        </form>
        <form action="/vote" method="post">
            <input type="hidden" name="vote" value="down" />
            <button type="submit">👎 Downvote</button>
        </form>
    </div>
</div>
</body>
</html>
